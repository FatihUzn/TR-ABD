<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Kampüs cephesi">
  <!-- Özgün çizim: neoklasik bir üniversite kütüphanesi cephesi.
       Herhangi bir fotoğrafın kopyası değil; sütun, alınlık ve
       merdiven gibi genel mimari ögelerden kurulu. -->
  <g fill="#ffffff">
    <!-- Gökyüzündeki ince ızgara -->
    <g opacity="0.06">
      <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200" stroke="#fff" stroke-width="1" fill="none"/>
    </g>

    <!-- Uzak kule (solda) -->
    <g opacity="0.10">
      <rect x="70" y="120" width="74" height="230"/>
      <path d="M60 120h94l-47-46z"/>
      <rect x="96" y="160" width="22" height="34" fill="#000" opacity="0.35"/>
    </g>

    <!-- Uzak kanat (sağda) -->
    <g opacity="0.09">
      <rect x="1010" y="196" width="150" height="154"/>
      <rect x="1034" y="224" width="20" height="44" fill="#000" opacity="0.3"/>
      <rect x="1070" y="224" width="20" height="44" fill="#000" opacity="0.3"/>
      <rect x="1106" y="224" width="20" height="44" fill="#000" opacity="0.3"/>
    </g>

    <!-- Ana cephe -->
    <g opacity="0.17">
      <!-- Alınlık -->
      <path d="M348 168 L600 78 L852 168 Z"/>
      <rect x="340" y="168" width="520" height="18"/>
      <!-- Sütunlar -->
      <g>
        <rect x="376" y="186" width="26" height="140"/>
        <rect x="446" y="186" width="26" height="140"/>
        <rect x="516" y="186" width="26" height="140"/>
        <rect x="586" y="186" width="26" height="140"/>
        <rect x="656" y="186" width="26" height="140"/>
        <rect x="726" y="186" width="26" height="140"/>
        <rect x="796" y="186" width="26" height="140"/>
      </g>
      <!-- Sütun başlıkları ve tabanları -->
      <g opacity="0.9">
        <rect x="370" y="186" width="38" height="9"/><rect x="370" y="318" width="38" height="9"/>
        <rect x="440" y="186" width="38" height="9"/><rect x="440" y="318" width="38" height="9"/>
        <rect x="510" y="186" width="38" height="9"/><rect x="510" y="318" width="38" height="9"/>
        <rect x="580" y="186" width="38" height="9"/><rect x="580" y="318" width="38" height="9"/>
        <rect x="650" y="186" width="38" height="9"/><rect x="650" y="318" width="38" height="9"/>
        <rect x="720" y="186" width="38" height="9"/><rect x="720" y="318" width="38" height="9"/>
        <rect x="790" y="186" width="38" height="9"/><rect x="790" y="318" width="38" height="9"/>
      </g>
      <!-- Merdiven -->
      <rect x="322" y="327" width="556" height="12"/>
      <rect x="300" y="339" width="600" height="12"/>
      <rect x="278" y="351" width="644" height="12"/>
      <rect x="256" y="363" width="688" height="12"/>
      <rect x="234" y="375" width="732" height="12"/>
      <rect x="212" y="387" width="776" height="33"/>
    </g>

    <!-- Cephenin arkasındaki kubbe -->
    <g opacity="0.08">
      <path d="M600 78 a58 58 0 0 1 58 58 h-116 a58 58 0 0 1 58 -58z" transform="translate(0,-46)"/>
      <rect x="596" y="4" width="8" height="30"/>
    </g>
  </g>
</svg>
