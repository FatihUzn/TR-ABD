<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hedef: ABD'de üniversite">
  <!-- Özgün çizim. Hiçbir fotoğrafın kopyası değil: gökyüzü, uzak
       şehir silueti ve önde sütunlu bir üniversite binası. Hedefin
       kendisi arka planda duruyor. -->
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfe2f7"/>
      <stop offset="42%"  stop-color="#e4eefb"/>
      <stop offset="78%"  stop-color="#f6f2ee"/>
      <stop offset="100%" stop-color="#fbf6f1"/>
    </linearGradient>
    <radialGradient id="isik" cx="0.76" cy="0.16" r="0.55">
      <stop offset="0%"   stop-color="#ffd9c9" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#ffe6d8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uzak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9db9dc"/>
      <stop offset="100%" stop-color="#b9cee9"/>
    </linearGradient>
    <linearGradient id="orta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d90bf"/>
      <stop offset="100%" stop-color="#8aa8ce"/>
    </linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33507c"/>
      <stop offset="100%" stop-color="#4a6892"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#gok)"/>
  <rect width="1600" height="1000" fill="url(#isik)"/>

  <!-- Bayrağı çağrıştıran çok soluk yatay bantlar -->
  <g fill="#c2334f" opacity="0.045">
    <rect x="0" y="120" width="1600" height="26"/>
    <rect x="0" y="188" width="1600" height="26"/>
    <rect x="0" y="256" width="1600" height="26"/>
    <rect x="0" y="324" width="1600" height="26"/>
  </g>

  <!-- Uzak tepeler -->
  <path d="M0 690 C 180 640, 320 700, 470 672 C 640 640, 760 700, 900 678
           C 1060 652, 1220 706, 1380 676 C 1470 660, 1540 682, 1600 670
           L1600 1000 L0 1000 Z" fill="url(#uzak)" opacity="0.42"/>

  <!-- Uzak şehir silueti -->
  <g fill="url(#uzak)" opacity="0.55">
    <rect x="60"  y="560" width="46" height="180"/>
    <rect x="118" y="600" width="34" height="140"/>
    <rect x="164" y="530" width="28" height="210"/>
    <rect x="204" y="596" width="52" height="144"/>
    <rect x="1284" y="588" width="44" height="152"/>
    <rect x="1340" y="536" width="30" height="204"/>
    <rect x="1382" y="606" width="56" height="134"/>
    <rect x="1450" y="566" width="36" height="174"/>
    <rect x="1498" y="618" width="48" height="122"/>
  </g>

  <!-- Orta katman: daha yakın bloklar -->
  <g fill="url(#orta)" opacity="0.42">
    <rect x="270" y="640" width="78" height="110"/>
    <rect x="360" y="612" width="42" height="138"/>
    <rect x="1140" y="628" width="70" height="122"/>
    <rect x="1218" y="656" width="46" height="94"/>
  </g>

  <!-- Önde üniversite binası: kubbe, alınlık, sütunlar, merdiven -->
  <g fill="url(#on)" opacity="0.30">
    <!-- kubbe -->
    <path d="M800 402 a76 76 0 0 1 76 76 h-152 a76 76 0 0 1 76 -76z"/>
    <rect x="794" y="352" width="12" height="52"/>
    <circle cx="800" cy="346" r="9"/>
    <rect x="700" y="478" width="200" height="18"/>
    <!-- alınlık -->
    <path d="M556 566 L800 470 L1044 566 Z"/>
    <rect x="548" y="566" width="504" height="22"/>
    <!-- sütunlar -->
    <g>
      <rect x="588" y="588" width="26" height="150"/>
      <rect x="654" y="588" width="26" height="150"/>
      <rect x="720" y="588" width="26" height="150"/>
      <rect x="787" y="588" width="26" height="150"/>
      <rect x="854" y="588" width="26" height="150"/>
      <rect x="920" y="588" width="26" height="150"/>
      <rect x="986" y="588" width="26" height="150"/>
    </g>
    <g opacity="0.9">
      <rect x="582" y="588" width="38" height="10"/><rect x="582" y="728" width="38" height="10"/>
      <rect x="648" y="588" width="38" height="10"/><rect x="648" y="728" width="38" height="10"/>
      <rect x="714" y="588" width="38" height="10"/><rect x="714" y="728" width="38" height="10"/>
      <rect x="781" y="588" width="38" height="10"/><rect x="781" y="728" width="38" height="10"/>
      <rect x="848" y="588" width="38" height="10"/><rect x="848" y="728" width="38" height="10"/>
      <rect x="914" y="588" width="38" height="10"/><rect x="914" y="728" width="38" height="10"/>
      <rect x="980" y="588" width="38" height="10"/><rect x="980" y="728" width="38" height="10"/>
    </g>
    <!-- yan kanatlar -->
    <rect x="430" y="644" width="118" height="94"/>
    <rect x="1052" y="644" width="118" height="94"/>
    <!-- merdiven -->
    <rect x="524" y="738" width="552" height="14"/>
    <rect x="498" y="752" width="604" height="14"/>
    <rect x="472" y="766" width="656" height="14"/>
    <rect x="446" y="780" width="708" height="14"/>
    <rect x="420" y="794" width="760" height="16"/>
  </g>

  <!-- Zemin: alta doğru açılan sis -->
  <rect x="0" y="740" width="1600" height="260" fill="#ffffff" opacity="0.55"/>
  <rect x="0" y="860" width="1600" height="140" fill="#ffffff" opacity="0.75"/>
</svg>
